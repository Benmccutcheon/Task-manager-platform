<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Task Board</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Portfolio Project</p>
				<h1>Task Board</h1>
			</div>

			<div class="topbar-actions">
				<button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
				<button id="openModalBtn" class="primary-btn">+ New Task</button>
			</div>
		</header>

		<section class="control-panel">
			<div class="search-wrap">
				<input type="text" id="searchInput" aria-label="Search tasks" placeholder="Search tasks..." />
			</div>

			<div class="filters">
				<select id="priorityFilter" aria-label="Filter by priority">
					<option value="all">All priorities</option>
					<option value="high">High priority</option>
					<option value="medium">Medium priority</option>
					<option value="low">Low priority</option>
				</select>

				<select id="categoryFilter" aria-label="Filter by category">
					<option value="all">All categories</option>
				</select>
			</div>
		</section>

		<section class="stats-grid">
			<article class="stat-card">
				<span>Total Tasks</span>
				<strong id="totalTasks">0</strong>
			</article>
			<article class="stat-card">
				<span>Completed</span>
				<strong id="completedTasks">0</strong>
			</article>
			<article class="stat-card">
				<span>High Priority</span>
				<strong id="highPriorityTasks">0</strong>
			</article>
			<article class="stat-card">
				<span>Overdue</span>
				<strong id="overdueTasks">0</strong>
			</article>
		</section>

		<main class="board">
			<section class="column" data-status="backlog">
				<div class="column-header">
					<h2>Backlog</h2>
					<span class="task-count" id="count-backlog">0</span>
				</div>
				<div class="task-list" id="backlog"></div>
			</section>

			<section class="column" data-status="todo">
				<div class="column-header">
					<h2>To Do</h2>
					<span class="task-count" id="count-todo">0</span>
				</div>
				<div class="task-list" id="todo"></div>
			</section>

			<section class="column" data-status="progress">
				<div class="column-header">
					<h2>In Progress</h2>
					<span class="task-count" id="count-progress">0</span>
				</div>
				<div class="task-list" id="progress"></div>
			</section>

			<section class="column" data-status="done">
				<div class="column-header">
					<h2>Done</h2>
					<span class="task-count" id="count-done">0</span>
				</div>
				<div class="task-list" id="done"></div>
			</section>
		</main>
	</div>

	<div class="modal hidden" id="taskModal">
		<div class="modal-card">
			<div class="modal-header">
				<h3 id="modalTitle">Create Task</h3>
				<button id="closeModalBtn" class="icon-btn" aria-label="Close modal">✕</button>
			</div>

			<form id="taskForm">
				<input type="hidden" id="taskId" />

				<label>
					Task Title
					<input type="text" id="taskTitle" required />
				</label>

				<label>
					Description
					<textarea id="taskDescription" rows="4" required></textarea>
				</label>

				<div class="form-grid">
					<label>
						Priority
						<select id="taskPriority" required>
							<option value="high">High</option>
							<option value="medium">Medium</option>
							<option value="low">Low</option>
						</select>
					</label>

					<label>
						Category
						<input type="text" id="taskCategory" placeholder="Frontend, Design..." required />
					</label>
				</div>

				<div class="form-grid">
					<label>
						Due Date
						<input type="date" id="taskDueDate" required />
					</label>

					<label>
						Assignee
						<input type="text" id="taskAssignee" placeholder="Name" required />
					</label>
				</div>

				<label>
					Status
					<select id="taskStatus">
						<option value="backlog">Backlog</option>
						<option value="todo">To Do</option>
						<option value="progress">In Progress</option>
						<option value="done">Done</option>
					</select>
				</label>

				<div class="modal-actions">
					<button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
					<button type="submit" class="primary-btn">Save Task</button>
				</div>
			</form>
		</div>
	</div>

	<div class="modal hidden" id="viewAllModal">
    <div class="modal-card view-all-card">
        <div class="modal-header">
            <h3 id="viewAllTitle">All Tasks</h3>
            <button id="closeViewAllBtn" class="icon-btn" aria-label="Close all tasks popup">✕</button>
        </div>
        <div id="viewAllList" class="view-all-list"></div>
    </div>
	</div>

	<script src="app.js"></script>
</body>
</html>
